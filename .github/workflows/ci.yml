name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Lint with ruff
        run: ruff check .

      - name: Type check with mypy
        run: mypy

      - name: Test with pytest
        run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t fictional-engine:latest .

      - name: Verify runtime user is non-root
        run: |
          # Override entrypoint and run whoami to check the runtime user
          RUNTIME_USER=$(docker run --rm --entrypoint whoami fictional-engine:latest)
          echo "Runtime user: $RUNTIME_USER"
          
          if [ "$RUNTIME_USER" = "root" ]; then
            echo "ERROR: Container is running as root!"
            exit 1
          fi
          
          echo "✓ Container verified to run as non-root user: $RUNTIME_USER"

      - name: Run replay CLI in built container
        run: |
          mkdir -p "$RUNNER_TEMP/replay-db"
          OUTPUT=$(docker run --rm \
            --entrypoint fictional-engine-replay \
            -v "$PWD/fixtures:/work/fixtures:ro" \
            -v "$RUNNER_TEMP/replay-db:/work/data" \
            fictional-engine:latest \
            /work/fixtures/replay/september-9-m1.json \
            --database-url sqlite:////work/data/replay.sqlite3)
          echo "$OUTPUT"
          case "$OUTPUT" in
            *'"inserted_versions": 5'* ) ;;
            * )
              echo "ERROR: replay CLI did not produce the expected summary"
              exit 1
              ;;
          esac
